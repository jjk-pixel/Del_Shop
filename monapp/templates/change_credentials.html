{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer les identifiants</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">🔑 Modifier mes identifiants</h2>

    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <p class="text-sm text-red-500">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-5">
      {% csrf_token %}  <!-- ✅ obligatoire -->
      
      <div>
        <label class="block text-gray-700 mb-1">Nouveau nom d'utilisateur</label>
        <input type="text" name="username" value="{{ user.username }}" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-green-300">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Nouveau mot de passe</label>
        <input type="password" name="password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-green-300">
      </div>

      <button type="submit"
        class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition">
        Mettre à jour
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="{% url 'liste_produits' %}" class="text-sm text-green-600 hover:underline">⬅ Retour</a>
    </div>
  </div>
</body>
</html>
