{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | Shopy Shoes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen
    {% if base_template == 'base_sombre.html' %}bg-gray-900{% else %}bg-gray-100{% endif %}">

  <form method="post" action="{% url 'admin-login' %}" 
        class="w-full max-w-md p-8 rounded-xl shadow-lg
        {% if base_template == 'base_sombre.html' %}bg-gray-800 text-gray-200{% else %}bg-white text-gray-900{% endif %}">
    {% csrf_token %}

    <h2 class="text-2xl font-bold text-center mb-6
        {% if base_template == 'base_sombre.html' %}text-gray-100{% else %}text-gray-800{% endif %}">
      Connexion
    </h2>

    <!-- Messages d'erreur -->
    {% if messages %}
      <div class="mb-4 text-red-500">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Username -->
    <label for="username" class="block font-medium mb-1
        {% if base_template == 'base_sombre.html' %}text-gray-200{% else %}text-gray-700{% endif %}">
      Nom d'utilisateur :
    </label>
    <input type="text" id="username" name="username"
           placeholder="Votre nom d'utilisateur"
           class="w-full border rounded-lg px-3 py-2 mb-4 mt-1 focus:ring-2 focus:ring-red-500
           {% if base_template == 'base_sombre.html' %}bg-gray-700 text-gray-200 border-gray-600{% else %}bg-white text-gray-900 border-gray-300{% endif %}"
           required>

    <!-- Password -->
    <label for="password" class="block font-medium mb-1
        {% if base_template == 'base_sombre.html' %}text-gray-200{% else %}text-gray-700{% endif %}">
      Mot de passe :
    </label>
    <input type="password" id="password" name="password" 
           placeholder="Mot de passe"
           class="w-full border rounded-lg px-3 py-2 mb-4 mt-1 focus:ring-2 focus:ring-red-500
           {% if base_template == 'base_sombre.html' %}bg-gray-700 text-gray-200 border-gray-600{% else %}bg-white text-gray-900 border-gray-300{% endif %}"
           required>

    <!-- Submit -->
    <input type="submit" value="Connexion"
           class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 font-semibold mb-4">
  </form>
</body>
</html>
